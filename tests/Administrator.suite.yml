actor: AdministratorTester
modules:
    enabled:
        - PhpBrowser:
              url: '%MICROSCHEMA_TEST_BASE_URL%'
        - Db:
              dsn: 'mysql:host=%JOOMLA_DB_HOST%;dbname=%JOOMLA_DB_NAME%'
              user: '%JOOMLA_DB_USER%'
              password: '%JOOMLA_DB_PASSWORD%'
              cleanup: false
              populate: false
        - JoomlaCodeception\Module\Joomla:
              client: administrator
              projectRoot: '%MICROSCHEMA_TEST_ROOT%'
              fixtureRoot: '%MICROSCHEMA_TEST_FIXTURE_ROOT%'
              fixtureNamespace: 'Tests\Fixtures\Functional'
              component: com_microschema
              componentAsset: com_microschema
              databasePrefix: '%JOOMLA_DB_PREFIX%'
              administratorLoginRoute: '/administrator/index.php'
              administratorTokenRoute: '/administrator/index.php?option=com_microschema'
              siteLoginRoute: '/index.php?option=com_users&view=login'
              siteTokenRoute: '/'
              filesystemRoots:
                  images: '%MICROSCHEMA_TEST_IMAGES_ROOT%'
                  storage: '%MICROSCHEMA_TEST_STORAGE_ROOT%'
                  tmp: '%MICROSCHEMA_TEST_TMP_ROOT%'
              publicImagePrefix: '/images/microschema-codeception'
              mutationLockName: microschema-codeception-fixtures
              mutationLockTimeout: 60
